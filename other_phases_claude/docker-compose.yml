name: todo-task-genie
services:

  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    env_file:
      - ./.env
    ports:
      - "8001:8001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - mcp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
        AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        DATABASE_URL: ${DATABASE_URL}
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy


networks:
  default:
    name: app-network
